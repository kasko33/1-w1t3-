<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>طاولتي | تسجيل الدخول</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body data-page="login">
  <section class="login-screen">
    <form id="loginForm" class="login-card">
      <div class="brand brand-lg"><span class="brand-icon">▦</span> طاولتي</div>
      <p class="muted">نظام إدارة الصالة وحجز الطاولات</p>
      <label>اسم المستخدم
        <input type="text" id="loginUser" required autocomplete="username" />
      </label>
      <label>كلمة المرور
        <input type="password" id="loginPassword" required autocomplete="current-password" />
      </label>
      <button type="submit" class="btn btn-primary btn-block" id="loginBtn">تسجيل الدخول</button>
      <p id="loginError" class="error-text"></p>
    </form>
  </section>
  <div id="toasts" class="toasts"></div>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
  <script src="app.js"></script>
</body>
</html>
