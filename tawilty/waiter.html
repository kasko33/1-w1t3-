<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>طاولتي | الويتر</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=1795376709" />
</head>
<body data-page="waiter">
  <div id="appShell" class="hidden">
    <nav class="navbar">
      <div class="brand"><span class="brand-icon">▦</span> طاولتي <span class="role-chip">الويتر</span></div>
      <div class="user-box">
        <span id="userLabel" class="muted"></span>
        <button class="btn btn-ghost" id="logoutBtn">خروج</button>
      </div>
    </nav>

    <main class="bento">
      <section class="bento-main">
        <div class="tile tile-header">
          <h2>مخطط الصالة</h2>
          <div class="legend">
            <span><i class="dot dot-available"></i>متاحة</span>
            <span><i class="dot dot-occupied"></i>مشغولة</span>
            <span><i class="dot dot-billing"></i>بانتظار الحساب</span>
          </div>
        </div>
        <div id="tablesGrid" class="tables-grid"></div>
      </section>

      <aside class="bento-side tile">
        <div id="sideEmpty" class="side-empty">
          <div class="big-icon">🍽️</div>
          <p>اضغط على طاولة متاحة لحجزها، أو طاولة مشغولة لإضافة الطلبات</p>
        </div>
        <div id="sideContent" class="hidden">
          <div class="side-head"><h3 id="sideTitle"></h3><span id="sideStatus" class="badge"></span></div>
          <p class="muted" id="sideTimer"></p>

          <div id="menuPicker" class="menu-picker">
            <div class="picker-head">
              <strong>اختر من القائمة</strong>
              <input type="search" id="menuSearch" placeholder="بحث عن صنف..." />
            </div>
            <div id="menuGrid" class="menu-grid"></div>
          </div>

          <ul id="itemsList" class="items-list"></ul>
          <div class="total-row"><span>المجموع الكلي</span><strong id="sideTotal">0</strong></div>
          <div class="side-actions">
            <button class="btn btn-warning btn-block" id="billBtn">إرسال الحساب للكاشير</button>
            <p class="muted center hidden" id="billNote">تم إرسال الحساب — الكاشير سيحصّل ويفرّغ الطاولة</p>
          </div>
        </div>
      </aside>
    </main>
  </div>

  <div id="confirmModal" class="modal hidden">
    <div class="modal-card">
      <h3 id="confirmTitle"></h3><p id="confirmText"></p>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="confirmNo">إلغاء</button>
        <button class="btn btn-primary" id="confirmYes">تأكيد</button>
      </div>
    </div>
  </div>
  <div id="toasts" class="toasts"></div>

  <script>
  window.addEventListener("error", function (e) {
    var b = document.getElementById("fatalBox");
    if (!b) { b = document.createElement("div"); b.id = "fatalBox"; document.body.appendChild(b); }
    b.innerHTML = "<strong>حدث خطأ في الصفحة</strong><br>" + (e.message || "خطأ غير معروف") +
      "<br><small>اضغط Ctrl+F5 لإعادة التحميل، وتأكد أنك استبدلت كل الملفات بالنسخة الجديدة.</small>";
  });
  window.addEventListener("load", function () {
    if (!window.firebase || !firebase.database) window.dispatchEvent(new ErrorEvent("error", { message: "تعذر تحميل مكتبة Firebase — تحقق من الإنترنت" }));
  });
</script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
  <script src="app.js?v=1795376709"></script>
</body>
</html>
