<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>طاولتي | صفحة الويتر</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body data-page="waiter">
  <div id="appShell" class="hidden">
    <nav class="navbar">
      <div class="brand"><span class="brand-icon">▦</span> طاولتي</div>
      <div class="tabs">
        <a class="tab active" href="waiter.html">صفحة الويتر</a>
        <a class="tab hidden" href="cashier.html" id="otherPageLink">صفحة الكاشير</a>
      </div>
      <div class="user-box">
        <span id="userLabel" class="muted"></span>
        <button class="btn btn-ghost" id="logoutBtn">خروج</button>
      </div>
    </nav>

    <main class="bento">
      <section class="bento-main">
        <div class="tile tile-header">
          <h2>مخطط الصالة</h2>
          <div class="legend">
            <span><i class="dot dot-available"></i>متاحة</span>
            <span><i class="dot dot-occupied"></i>مشغولة</span>
            <span><i class="dot dot-billing"></i>بانتظار الحساب</span>
          </div>
        </div>
        <div id="tablesGrid" class="tables-grid"></div>
      </section>

      <aside class="bento-side tile">
        <div id="sideEmpty" class="side-empty">
          <div class="big-icon">🧾</div>
          <p>اضغط على طاولة متاحة لحجزها، أو طاولة مشغولة لإدارة أصنافها</p>
        </div>
        <div id="sideContent" class="hidden">
          <div class="side-head"><h3 id="sideTitle"></h3><span id="sideStatus" class="badge"></span></div>
          <p class="muted" id="sideTimer"></p>
          <form id="addItemForm" class="add-item">
            <input type="text" id="itemName" placeholder="اسم الصنف" required />
            <div class="row">
              <input type="number" id="itemQty" placeholder="الكمية" min="1" step="1" value="1" required />
              <input type="number" id="itemPrice" placeholder="سعر الوحدة" min="0" step="any" required />
            </div>
            <button class="btn btn-primary btn-block" type="submit">+ إضافة صنف</button>
          </form>
          <ul id="itemsList" class="items-list"></ul>
          <div class="total-row"><span>المجموع الكلي</span><strong id="sideTotal">0</strong></div>
          <div class="side-actions">
            <button class="btn btn-warning btn-block" id="billBtn">طلب الحساب</button>
            <button class="btn btn-primary btn-block" id="checkoutBtn">تفريغ الطاولة (Checkout)</button>
          </div>
        </div>
      </aside>
    </main>
  </div>

  <div id="confirmModal" class="modal hidden">
    <div class="modal-card">
      <h3 id="confirmTitle"></h3><p id="confirmText"></p>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="confirmNo">إلغاء</button>
        <button class="btn btn-primary" id="confirmYes">تأكيد</button>
      </div>
    </div>
  </div>
  <div id="toasts" class="toasts"></div>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="app.js"></script>
</body>
</html>
